[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # DTZ001/DTZ005 — naive datetime.now()/datetime() calls. Flagged in
    # scraper/loader.py, scraper/gcs_uploader.py, scraper/bq_loader.py,
    # great_expectations/validate_batch.py and both housing_pipeline_dag.py
    # copies. These are all local-partition-date / log-timestamp uses inside
    # the Airflow container, which runs in UTC — making them tz-aware would
    # touch date-partitioning logic across the whole pipeline for no
    # behavioral gain. Real known debt, not silently ignored: tracked in
    # README future improvements rather than fixed as a lint-CI side effect.
    "DTZ001",
    "DTZ005",

    # BLE001 — scraper/scrapper.py catches a blind Exception per-listing
    # inside the parse loop (scrape_city). Deliberate: one malformed OLX ad
    # shouldn't kill the whole city's scrape run. Narrowing this to specific
    # exception types would need to track every failure mode OLX's HTML/JSON
    # can throw, which isn't worth it for a per-item resilience catch.
    "BLE001",
]