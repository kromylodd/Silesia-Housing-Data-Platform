version: 2

models:
  - name: dim_city
    description: >
      One row per distinct city present in stg_listings (currently the
      8 MVP cities; grows automatically as scraper coverage expands).
      Enriched with voivodeship and is_mvp via the city_lookup seed.
    columns:
      - name: city_key
        tests: [unique, not_null]
      - name: city
        tests: [not_null]
      - name: voivodeship
        tests: [not_null]
      - name: is_mvp
        tests: [not_null]

  - name: dim_district
    description: One row per (city, district) pair. district is 'Unknown' where OLX didn't supply one.
    columns:
      - name: district_key
        tests: [unique, not_null]
      - name: city
        tests: [not_null]
      - name: district
        tests: [not_null]

  - name: dim_building_type
    description: One row per distinct building_type value, including 'Unknown'.
    columns:
      - name: building_type_key
        tests: [unique, not_null]

  - name: dim_market
    description: One row per market_type value (primary/secondary/Unknown).
    columns:
      - name: market_key
        tests: [unique, not_null]

  - name: dim_date
    description: Day-grain date spine, 2025-01-01 through one year past current_date.
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]

  - name: fact_apartments
    description: >
      One row per listing (current-state grain, same as stg_listings — a
      listing's price history isn't tracked here, that's the job of the
      dbt snapshot in snapshots_listings). Grain: one row per listing_id.
      Materialized incrementally (merge on listing_key): each run only
      re-reads listings whose date_collected is newer than this table's
      current max date_collected_key, so scan cost doesn't grow with the
      full history of raw_apartment_listings. If stg_listings' dedup/
      mapping logic changes retroactively, run
      `dbt run --full-refresh -s fact_apartments`.
    columns:
      - name: listing_key
        tests:
          - unique
          - not_null
      - name: city_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_key
      - name: district_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key
      - name: building_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_building_type')
                field: building_type_key
      - name: market_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_market')
                field: market_key
      - name: date_collected_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: date_published_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                where: "date_published_key is not null"
      - name: price
        tests: [not_null]
      - name: area_sqm
        tests: [not_null]

  - name: mart_price_statistics
    description: Single-row global KPI snapshot (avg/median/min/max/stddev price and price/m²) for dashboard overview cards.
    columns:
      - name: total_listings
        tests: [not_null]
      - name: avg_price
        tests: [not_null]

  - name: mart_city_summary
    description: One row per city — avg price, listing count, median area, avg rooms, avg price/m².
    columns:
      - name: city
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('city_lookup')
                field: city_name
      - name: num_listings
        tests: [not_null]

  - name: mart_district_summary
    description: One row per (city, district) — excludes 'Unknown' district. Ranked by avg price/m² both directions.
    columns:
      - name: city
        tests: [not_null]
      - name: district
        tests: [not_null]
      - name: rank_most_expensive
        tests: [not_null]
      - name: rank_cheapest
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city
              - district

  - name: mart_market_trends
    description: >
      One row per (period_type, period_start) — day/week/month averages
      plus period-over-period price change (price_change_pct: positive =
      growth, negative = decline). Sourced from int_listings_daily, not
      stg_listings, so it reflects actual daily history.
    columns:
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['day', 'week', 'month']
      - name: period_start
        tests: [not_null]
      - name: avg_price
        tests: [not_null]
      - name: num_listings
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - period_type
              - period_start