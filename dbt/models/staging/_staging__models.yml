version: 2

seeds:
  - name: city_lookup
    description: >
      Maps raw source_city scrape-target slugs to standardized display
      names and voivodeship, for the ~34 Polish cities at or above the
      GUS 100k population threshold (Stage 2 scope). is_mvp flags the
      original 8 Silesian cities already covered by the scraper; the
      other 26 are enrichment/lookup only until the scraper's target
      city list is expanded.
    columns:
      - name: source_city
        description: Lowercase, diacritic-free slug used as the OLX search query value.
        tests: [unique, not_null]
      - name: city_name
        description: Standardized display name with proper Polish diacritics.
        tests: [not_null]
      - name: voivodeship
        tests: [not_null]
      - name: is_mvp
        tests: [not_null]
      - name: bbox_lat_min
        description: >
          Southern latitude bound of the city's geo-validation bounding box
          (city center +/- a tier-sized buffer: ~28km for large metros,
          ~20km mid-sized, ~14km for the dense Upper Silesian conurbation
          cities). Used by both GE (validate_batch.py, pre-load) and
          assert_geo_within_city_bounds.sql (post-load defense-in-depth) to
          catch OLX fuzzy-search noise — a listing whose lat/lon land far
          outside the target city's box despite being returned for that
          city's search query.
        tests: [not_null]
      - name: bbox_lat_max
        tests: [not_null]
      - name: bbox_lon_min
        tests: [not_null]
      - name: bbox_lon_max
        tests: [not_null]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "bbox_lat_min < bbox_lat_max and bbox_lon_min < bbox_lon_max"

models:
  - name: stg_listings
    description: >
      One row per listing, deduplicated to its most recent scrape.
      Historical price changes are tracked separately via dbt snapshots
      (planned), not in this model.
    columns:
      - name: listing_key
        description: Surrogate key (hash of listing_id). Use this for downstream joins.
        tests:
          - unique
          - not_null

      - name: listing_id
        description: Native OLX listing ID.
        tests:
          - unique
          - not_null

      - name: city
        description: Standardized city name (proper Polish diacritics), derived from source_city.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('city_lookup')
                field: city_name

      # district is intentionally NOT tested not_null — it's legitimately
      # missing for a meaningful share of listings (see GE warning suite /
      # DISTRICT_NOT_NULL_REFERENCE), not a data quality bug.

      - name: price
        tests:
          - not_null

      - name: area_sqm
        tests:
          - not_null

      - name: market_type
        tests:
          - accepted_values:
              arguments:
                values: ['primary', 'secondary']
              config:
                severity: warn  # not GE-gated upstream — don't hard-fail the build on it yet