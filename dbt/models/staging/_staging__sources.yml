version: 2

sources:
  - name: raw_housing
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: raw_housing
    tables:
      - name: raw_apartment_listings
        description: >
          Raw OLX apartment listings. Appended daily by the Airflow pipeline
          (scrape >> validate >> upload >> load_bq), no transformations.
          A listing_id can appear multiple times across different
          date_collected values if it was still active on a later scrape.
        config:
          loaded_at_field: date_collected
        columns:
          - name: id
            description: Native OLX listing ID.
            tests:
              - not_null
          - name: source_city
            description: The scrape target city (reliable filter — see stg_listings for why `city` isn't).
            tests:
              - not_null
