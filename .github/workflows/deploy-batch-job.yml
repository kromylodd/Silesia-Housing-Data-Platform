name: Deploy Batch Job

on:
  push:
    branches: [main]
    paths:
      - "cloud_run_job/**"
      - "scraper/**"
      - "great_expectations/**"
      - "dbt/**"

env:
  GCP_PROJECT_ID: silesia-housing-data-platform
  GCP_REGION: europe-central2
  AR_REPO: housing-batch-job
  IMAGE_NAME: daily-batch
  RUN_JOB_NAME: housing-daily-batch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BATCH_DEPLOY_SA_KEY }}
          # TODO: replace with Workload Identity Federation — same migration
          # planned for the dbt CI job's DBT_SA_KEY, do both at once.

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker build -f cloud_run_job/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Update Cloud Run Job image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run jobs update ${{ env.RUN_JOB_NAME }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --image="$IMAGE"